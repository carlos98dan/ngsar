<div class="flex items-center justify-center min-h-screen bg-gray-50">
  <app-card>
    <h1 appCardTitle class="text-2xl font-bold p-3 text-center text-gray-900">Login</h1>

    <div class="flex flex-col gap-4">
      <div>
        <app-input label="Correo electrónico" type="email" size="md" placeholder="tu@email.com" [fullWidth]="true"
          [required]="true"></app-input>
      </div>

      <div>
        <app-input label="Contraseña" type="password" size="md" placeholder="Contraseña" [fullWidth]="true"
          [required]="true"></app-input>
      </div>

      <app-button label="Iniciar Sesión" variant="primary" size="md" [fullWidth]="true"
        (clicked)="onLogin()"></app-button>
    </div>
  </app-card>
</div>
