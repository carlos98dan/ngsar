<div>
  @if (label()) {
  <label class="label-base">
    {{ label() }}
    @if (required()) {
    <span class="text-danger-600">*</span>
    }
  </label>
  }
  <div class="relative">
    <div
      class="absolute left-3 top-1/2 transform -translate-y-1/2 text-text-placeholder pointer-events-none flex items-center justify-center">
      <ng-content select="[iconLeft]"></ng-content>
    </div>

    <input [type]="inputType()" [placeholder]="placeholder()" [disabled]="disabled()" [required]="required()"
      [value]="value()" (input)="value.set($event.target.value)" [class]="inputClasses()" />

    @if (type() === 'password') {
    <div class="absolute right-3 top-1/2 transform -translate-y-1/2">
      <app-button variant="icon" size="sm" [disabled]="disabled()" (clicked)="togglePassword()">
        @if (this.showPassword()) {
        <svg iconLeft lucideEye class="flex-shrink-0 w-5 h-5"></svg>
        } @else {
        <svg iconRight lucideEyeOff class="flex-shrink-0 w-5 h-5"></svg>
        }
      </app-button>
    </div>
    } @else {
    <div
      class="absolute right-3 top-1/2 transform -translate-y-1/2 text-text-placeholder pointer-events-none flex items-center justify-center">
      <ng-content select="[iconRight]"></ng-content>
    </div>
    }
  </div>
</div>
