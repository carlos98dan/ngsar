<div>
  @if (label()) {
    <label class="block text-sm font-medium text-gray-700 mb-2">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }
  <div class="relative">
    <!-- Left icon -->
    @if ((iconSvg() || iconSrc()) && iconPosition() === 'left' && type() !== 'password') {
      <div class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none flex items-center justify-center">
        @if (iconSvg()) {
          <div [innerHTML]="iconSvg()" class="w-5 h-5"></div>
        } @else {
          <img [src]="iconSrc()" alt="icon" class="w-5 h-5" />
        }
      </div>
    }

    <input
      [type]="inputType()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [required]="required()"
      [value]="value()"
      (input)="value.set($event.target.value)"
      [class]="inputClasses()"
      [class.pl-10]="(iconSvg() || iconSrc()) && iconPosition() === 'left' && type() !== 'password'"
      [class.pr-10]="(iconSvg() || iconSrc() || type() === 'password') && (iconPosition() === 'right' || type() === 'password')"
    />

    <!-- Right icon or password toggle -->
    @if (type() === 'password') {
      <div class="absolute right-3 top-1/2 transform -translate-y-1/2">
        <app-button
          variant="icon"
          size="sm"
          [disabled]="disabled()"
          [iconSvg]="getEyeIcon()"
          (clicked)="togglePassword()"
        ></app-button>
      </div>
    } @else if ((iconSvg() || iconSrc()) && iconPosition() === 'right') {
      <div class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none flex items-center justify-center">
        @if (iconSvg()) {
          <div [innerHTML]="iconSvg()" class="w-5 h-5"></div>
        } @else {
          <img [src]="iconSrc()" alt="icon" class="w-5 h-5" />
        }
      </div>
    }
  </div>
</div>
