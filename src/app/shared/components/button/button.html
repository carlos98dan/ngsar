<button [disabled]="disabled()" [class]="buttonClasses()"
  [class.flex]="iconSvg() || iconSrc()"
  [class.items-center]="iconSvg() || iconSrc()"
  [class.justify-center]="variant() === 'icon' || (iconSvg() || iconSrc())"
  [class.gap-2]="(iconSvg() || iconSrc()) && variant() !== 'icon'" (click)="onClick()">
  @if ((iconSvg() || iconSrc()) && iconPosition() === 'left') {
    @if (iconSvg()) {
      <div [innerHTML]="iconSvg()" class="flex items-center justify-center"></div>
    } @else {
      <img [src]="iconSrc()" alt="icon" class="w-5 h-5" />
    }
  }
  @if (variant() !== 'icon') {
    {{ label() }}
  }
  @if ((iconSvg() || iconSrc()) && iconPosition() === 'right') {
    @if (iconSvg()) {
      <div [innerHTML]="iconSvg()" class="flex items-center justify-center"></div>
    } @else {
      <img [src]="iconSrc()" alt="icon" class="w-5 h-5" />
    }
  }
</button>
