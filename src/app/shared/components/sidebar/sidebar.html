<aside
  [class]="'sidebar h-screen overflow-y-auto flex flex-col transition-all duration-300 ' + (isMinimized() ? 'w-20' : 'w-64')">
  <!-- Header -->
  <div class="px-4 py-6 border-b border-primary-800">
    <div class="flex items-center justify-between">
      @if (!isMinimized()) {
      <h2 class="text-lg font-semibold">NGSAR</h2>
      }
      <button (click)="toggleMinimize()"
        class="p-2 hover:bg-primary-600 rounded-lg transition flex items-center justify-center flex-shrink-0">
        @if (isMinimized()) {
        <svg lucideChevronRight class="flex-shrink-0 w-5 h-5"></svg>
        } @else {
        <svg lucideChevronLeft class="flex-shrink-0 w-5 h-5"></svg>
        }
      </button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-4 space-y-1">
    <a href="#" class="sidebar-item sidebar-item-hover">
      <svg lucideGrid2x2 class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span class="text-sm">Módulo 1</span>
      }
    </a>
    <a href="#" class="sidebar-item sidebar-item-hover">
      <svg lucideTrendingUp class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span class="text-sm">Módulo 2</span>
      }
    </a>
    <a href="#" class="sidebar-item sidebar-item-hover">
      <svg lucideSettings class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span class="text-sm">Módulo 3</span>
      }
    </a>
  </nav>

  <!-- Footer (opcional) -->
  <div class="px-3 py-4 border-t border-primary-800">
    <button class="sidebar-item sidebar-item-hover w-full">
      <svg lucideLogOut class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span class="text-sm">Salir</span>
      }
    </button>
  </div>
</aside>
