<aside
  [class]="'sidebar h-screen overflow-y-auto flex flex-col transition-all duration-300 ' + (isMinimized() ? 'w-20' : 'w-64')">
  <!-- Header -->
  <div class="px-4 py-6 border-b border-primary-800">
    <div class="flex items-center justify-between">
      @if (!isMinimized()) {
      <h2 class="text-lg font-semibold">NGSAR</h2>
      }
      <app-button variant="icon" size="md" (clicked)="toggleMinimize()">
        @if (isMinimized()) {
        <svg iconRight lucideChevronRight class="flex-shrink-0 w-5 h-5 text-secondary-200 hover:text-inherit"></svg>
        } @else {
        <svg iconRight lucideChevronLeft class="flex-shrink-0 w-5 h-5 text-secondary-200 hover:text-inherit"></svg>
        }
      </app-button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-4 space-y-1">
    <a routerLink="/calendar" class="sidebar-item sidebar-item-hover">
      <svg lucideCalendar class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span class="text-sm text-nowrap">Calendar</span>
      }
    </a>
    <a href="#" class="sidebar-item sidebar-item-hover">
      <svg lucideTrendingUp class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span class="text-sm text-nowrap">Módulo 2</span>
      }
    </a>
    <a href="#" class="sidebar-item sidebar-item-hover">
      <svg lucideSettings class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span class="text-sm text-nowrap">Módulo 3</span>
      }
    </a>
  </nav>

  <!-- Footer (opcional) -->
  <div class="px-3 py-4 border-t border-primary-800">
    <app-button variant="icon" size="md" (clicked)="onLogout()" [fullWidth]="!isMinimized()">
      <svg iconLeft lucideLogOut class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span class="text-sm">Salir</span>
      }
    </app-button>
  </div>
</aside>
