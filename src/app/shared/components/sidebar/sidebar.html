<aside
  [class]="'bg-gradient-to-b from-blue-600 to-indigo-600 text-white h-screen overflow-y-auto flex flex-col transition-all duration-300 ' + (isMinimized() ? 'w-20' : 'w-64')">
  <!-- Header -->
  <div class="p-6 border-b border-blue-500">
    <div class="flex items-center justify-between">
      @if (!isMinimized()) {
      <h2 class="text-xl font-bold">NGSAR</h2>
      }
      <button (click)="toggleMinimize()"
        class="p-2 hover:bg-blue-500 rounded-lg transition text-white flex items-center justify-center">
        @if (isMinimized()) {
        <svg lucideChevronRight class="flex-shrink-0 w-5 h-5"></svg>
        } @else {
        <svg lucideChevronLeft class="flex-shrink-0 w-5 h-5"></svg>
        }
      </button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 space-y-2">
    <a href="#" class="flex items-center gap-4 py-3 px-4 rounded-lg hover:bg-blue-500 transition">
      <svg lucideGrid2x2 class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span>Módulo 1</span>
      }
    </a>
    <a href="#" class="flex items-center gap-4 py-3 px-4 rounded-lg hover:bg-blue-500 transition">
      <svg lucideTrendingUp class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span>Módulo 2</span>
      }
    </a>
    <a href="#" class="flex items-center gap-4 py-3 px-4 rounded-lg hover:bg-blue-500 transition">
      <svg lucideSettings class="flex-shrink-0 w-5 h-5"></svg>
      @if (!isMinimized()) {
      <span>Módulo 3</span>
      }
    </a>
  </nav>
</aside>
